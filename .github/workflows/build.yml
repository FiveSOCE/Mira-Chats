name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: gradle clean build --stacktrace

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: MiraChats
          path: build/libs/MiraChats-*.jar

      - name: Publish v0.1.1 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.1
          target_commitish: main
          name: MiraChats v0.1.1
          body: |
            [item] compatibility hotfix.

            - Runs rich item replacement after chat formatters.
            - Removes a brittle newer Paper item-name call.
            - Adds /mirachats status diagnostics.
            - Adds optional debug logging.
          make_latest: true
          files: build/libs/MiraChats-0.1.1.jar
