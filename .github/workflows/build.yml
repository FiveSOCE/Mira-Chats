name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: gradle clean build --stacktrace

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: MiraChats
          path: build/libs/MiraChats-*.jar

      - name: Publish v0.2.0 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          target_commitish: main
          name: MiraChats v0.2.0
          body: |
            EssentialsXChat-native [item] bridge.

            - Hooks Essentials GlobalChatEvent and LocalChatEvent directly.
            - Lets Essentials calculate the final format and recipients.
            - Cancels only [item] messages and rebroadcasts them as Adventure components.
            - Preserves native item hover data.
            - Normal messages remain fully owned by EssentialsXChat.
          make_latest: true
          files: build/libs/MiraChats-0.2.0.jar
