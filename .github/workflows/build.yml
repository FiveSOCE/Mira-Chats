name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' build.gradle.kts | head -n1)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download EssentialsX API jar
        run: |
          mkdir -p libs
          curl -fL "https://github.com/EssentialsX/Essentials/releases/download/2.22.0/EssentialsX-2.22.0.jar" \
            -o libs/EssentialsX-2.22.0.jar

      - name: Build
        run: gradle clean build --stacktrace

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: MiraChats-${{ steps.version.outputs.version }}
          path: build/libs/MiraChats-${{ steps.version.outputs.version }}.jar
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          JAR="build/libs/MiraChats-$VERSION.jar"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "$JAR" \
              --target "${{ github.sha }}" \
              --title "MiraChats $TAG" \
              --notes "Adds MiraFactions chat prefixes before the existing EssentialsXChat/LuckPerms format. CoLeaders receive *, Leaders receive **, and factionless players keep the existing chat format unchanged."
          fi
