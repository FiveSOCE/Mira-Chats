name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download EssentialsX API jar
        run: |
          mkdir -p libs
          curl -fL "https://github.com/EssentialsX/Essentials/releases/download/2.22.0/EssentialsX-2.22.0.jar"             -o libs/EssentialsX-2.22.0.jar

      - name: Build
        run: gradle clean build --stacktrace

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: MiraChats
          path: build/libs/MiraChats-*.jar

      - name: Publish v0.3.0 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0
          target_commitish: main
          name: MiraChats v0.3.0
          body: |
            Rich chat bundle.

            - [item] keeps native item hover.
            - [inv] links a read-only inventory snapshot.
            - [enderchest] links a read-only ender chest snapshot.
            - @player mentions can prefill /msg.
            - /mchannel supports auto, global and local modes.
            - Normal EssentialsXChat formatting remains preserved.
          make_latest: true
          files: build/libs/MiraChats-0.3.0.jar
