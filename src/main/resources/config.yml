debug: false

item-link:
  enabled: true
  placeholder: "[item]"
  case-sensitive: false
  permission: "mirachats.item"

inventory-link:
  enabled: true
  placeholder: "[inv]"
  case-sensitive: false
  permission: "mirachats.inventory"

enderchest-link:
  enabled: true
  placeholder: "[enderchest]"
  case-sensitive: false
  permission: "mirachats.enderchest"

mentions:
  enabled: true
  permission: "mirachats.mentions"

channels:
  enabled: true
  local-radius: 100.0

factions:
  enabled: true
  format: "&f<%marker%%faction%>&r "
  role-markers:
    member: ""
    coleader: "*"
    leader: "**"

snapshots:
  # Linked inventory and ender chest views are immutable snapshots.
  ttl-seconds: 120
